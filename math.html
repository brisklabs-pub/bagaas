<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Racing Game</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f6f9;
    margin: 20px;
}

h1 { color: #333; }

#track {
    width: 90%;
    max-width: 800px;
    height: 80px;
    margin: 20px auto;
    border: 3px solid #333;
    position: relative;
    background: repeating-linear-gradient(
        90deg,
        #ddd,
        #ddd 20px,
        white 20px,
        white 40px
    );
    overflow: hidden;
}

#car {
    position: absolute;
    left: 0;
    top: 20px;
    font-size: 40px;
    transition: left 0.3s;
}

#question {
    font-size: 32px;
    margin: 20px;
    font-weight: bold;
}

input {
    font-size: 24px;
    padding: 10px;
    width: 150px;
    text-align: center;
}

button {
    font-size: 20px;
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
}

#score, #timer {
    font-size: 24px;
    margin: 10px;
}
</style>
</head>
<body>

<h1>🏎️ Math Racing Game</h1>

<div id="timer">⏱️ Time: 60</div>
<div id="score">🏆 Score: 0</div>

<div id="track">
    <div id="car">🏎️</div>
</div>

<div id="question"></div>

<input type="number" id="answer" placeholder="Answer">
<br>

<button onclick="checkAnswer()">Submit</button>
<button onclick="startGame()">New Game</button>

<script>
let correctAnswer = 0;
let score = 0;
let carPosition = 0;
let timeLeft = 60;
let timer;

function generateQuestion() {
    const operations = ['+', '-', '*'];

    const op = operations[Math.floor(Math.random() * operations.length)];

    let a, b;

    switch(op) {
        case '+':
            a = Math.floor(Math.random() * 50) + 1;
            b = Math.floor(Math.random() * 50) + 1;
            correctAnswer = a + b;
            break;

        case '-':
            a = Math.floor(Math.random() * 50) + 20;
            b = Math.floor(Math.random() * a);
            correctAnswer = a - b;
            break;

        case '*':
            a = Math.floor(Math.random() * 12) + 1;
            b = Math.floor(Math.random() * 12) + 1;
            correctAnswer = a * b;
            break;
    }

    document.getElementById('question').textContent =
        `${a} ${op} ${b} = ?`;

    document.getElementById('answer').value = '';
    document.getElementById('answer').focus();
}

function checkAnswer() {
    const userAnswer = Number(document.getElementById('answer').value);

    if (userAnswer === correctAnswer) {
        score += 10;
        carPosition += 40;

        document.getElementById('score').textContent =
            `🏆 Score: ${score}`;

        document.getElementById('car').style.left =
            `${carPosition}px`;

        if (carPosition >= 700) {
            clearInterval(timer);

            setTimeout(() => {
                alert(`🎉 You Win!\nFinal Score: ${score}`);
            }, 100);
            return;
        }
    }

    generateQuestion();
}

function startGame() {
    clearInterval(timer);

    score = 0;
    carPosition = 0;
    timeLeft = 180;

    document.getElementById('score').textContent =
        '🏆 Score: 0';

    document.getElementById('timer').textContent =
        '⏱️ Time: 60';

    document.getElementById('car').style.left = '0px';

    generateQuestion();

    timer = setInterval(() => {
        timeLeft--;

        document.getElementById('timer').textContent =
            `⏱️ Time: ${timeLeft}`;

        if (timeLeft <= 0) {
            clearInterval(timer);

            alert(
                `⏰ Time's Up!\nScore: ${score}`
            );
        }
    }, 1000);
}

document.getElementById('answer').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkAnswer();
    }
});

startGame();
</script>

</body>
</html>
