<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match Game</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

h1 {
    color: #333;
}

#gameBoard {
    display: grid;
    grid-template-columns: repeat(4, 90px);
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
}

.card {
    width: 90px;
    height: 90px;
    background: #4CAF50;
    color: white;
    font-size: 32px;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
}

.card.flipped {
    background: white;
    color: black;
    border: 2px solid #4CAF50;
}

#status {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: #2196F3;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🧠 Memory Match Game</h1>
<p>Find all matching pairs!</p>

<div id="gameBoard"></div>

<div id="status">
    Moves: <span id="moves">0</span>
</div>

<button onclick="startGame()">New Game</button>

<script>
const symbols = [
    "🍎","🍎",
    "🐶","🐶",
    "🚗","🚗",
    "⭐","⭐",
    "📚","📚",
    "🎵","🎵",
    "🌈","🌈",
    "⚽","⚽"
];

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let moves = 0;
let matches = 0;

function shuffle(array) {
    for(let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startGame() {
    const board = document.getElementById("gameBoard");
    board.innerHTML = "";

    moves = 0;
    matches = 0;
    firstCard = null;
    secondCard = null;
    lockBoard = false;

    document.getElementById("moves").textContent = moves;

    let gameSymbols = [...symbols];
    shuffle(gameSymbols);

    gameSymbols.forEach(symbol => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.symbol = symbol;
        card.textContent = "?";

        card.addEventListener("click", () => flipCard(card));

        board.appendChild(card);
    });
}

function flipCard(card) {
    if (
        lockBoard ||
        card === firstCard ||
        card.classList.contains("matched")
    ) {
        return;
    }

    card.classList.add("flipped");
    card.textContent = card.dataset.symbol;

    if (!firstCard) {
        firstCard = card;
        return;
    }

    secondCard = card;
    moves++;
    document.getElementById("moves").textContent = moves;

    if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        matches++;

        firstCard = null;
        secondCard = null;

        if (matches === symbols.length / 2) {
            setTimeout(() => {
                alert(`🎉 Great Job! You won in ${moves} moves!`);
            }, 300);
        }

    } else {
        lockBoard = true;

        setTimeout(() => {
            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            firstCard.textContent = "?";
            secondCard.textContent = "?";

            firstCard = null;
            secondCard = null;
            lockBoard = false;
        }, 1000);
    }
}

startGame();
</script>

</body>
</html>
